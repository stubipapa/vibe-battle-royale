<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5人連線萬物大逃殺 - Vibe Coding 課堂版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
      padding: 16px;
    }
    h1 { font-size: 20px; letter-spacing: 0.5px; color: #fde047; text-align: center; }
    .stage-wrap {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 800 / 600;
      border: 3px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      background: #1e293b;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      text-align: center;
      overflow-y: auto;
    }
    @media (max-width: 600px) {
      .overlay { justify-content: flex-start; gap: 10px; padding: 12px; }
      .overlay h2 { font-size: 18px; }
      button { padding: 10px 16px; font-size: 14px; }
    }
    .hidden { display: none !important; }
    .mode-btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
    input {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #3b82f6; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 700;
      transition: transform 0.1s, opacity 0.15s;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-practice { background: #22c55e; color: #052e16; }
    .btn-online { background: #3b82f6; color: #eff6ff; }
    .btn-secondary { background: #475569; color: #f8fafc; padding: 8px 16px; font-size: 14px; }
    .btn-emergency {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.45);
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
    }
    .btn-emergency:hover:not(:disabled) {
      background: rgba(245, 158, 11, 0.22);
      border-color: #fbbf24;
    }
    .controls-hint {
      font-size: 13px;
      color: #cbd5e1;
      background: #1e293b;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .toolbar {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #94a3b8;
    }
    .player-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 580px; }
    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      background: #1e293b;
      border: 1px solid #475569;
      font-size: 13px;
    }
    .chip-host { border-color: #facc15; color: #fde047; }
    .room-badge {
      font-family: monospace;
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      background: #0f172a;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #38bdf8;
    }
  </style>
</head>
<body>
  <h1>🎮 5人連線萬物大逃殺（盲盒開局）</h1>

  <div class="stage-wrap">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- 入口模式選擇畫面 -->
    <div id="menuOverlay" class="overlay">
      <h2>請選擇遊戲模式</h2>
      <p style="color:#94a3b8;max-width:480px;line-height:1.6;">
        開局前沒有人知道自己的角色、武器與道具功能！<br />
        系統將於開戰瞬間隨機分配「盲盒組合」。
      </p>
      <div class="mode-btns">
        <button id="btnPractice" class="btn-practice">🧪 練習模式（單人示範／測試）</button>
        <button id="btnOnline" class="btn-online">🌐 連線模式（須滿 5 人開戰）</button>
      </div>
      <div class="controls-hint">
        操作：<strong>↑ ↓ ← →</strong> 移動 ｜ <strong>Z / X</strong> 逆／順時針瞄準 ｜ <strong>Space</strong> 開火
      </div>
    </div>

    <!-- 連線模式：建立或加入房間 -->
    <div id="roomSetupOverlay" class="overlay hidden">
      <h2>🌐 5 人連線模式（教師開房觀戰 × 5 位學生對戰）</h2>
      <div class="row">
        <label for="inputNickname" style="color:#cbd5e1;">你的暱稱：</label>
        <input id="inputNickname" type="text" maxlength="14" placeholder="請輸入暱稱" />
      </div>
      <div class="mode-btns">
        <button id="btnCreateRoom" class="btn-online">🏠 教師開房（建立房間並觀戰轉播）</button>
      </div>
      <div class="row" style="margin-top:4px;">
        <input id="inputRoomCode" type="text" maxlength="10" placeholder="輸入 6 碼房號" style="width:150px;text-transform:uppercase;" />
        <button id="btnJoinRoom" class="btn-practice">🚪 學生加入房間</button>
      </div>
      <p id="roomErrorMsg" style="color:#f87171;font-size:13px;min-height:18px;"></p>
    </div>

    <!-- 連線等待 5 位學生大廳 -->
    <div id="lobbyOverlay" class="overlay hidden">
      <div class="row">
        <span>房號：</span>
        <span id="lobbyRoomCode" class="room-badge">------</span>
        <button id="btnCopyInvite" class="btn-secondary">📋 複製邀請連結</button>
      </div>
      <p id="lobbyHostLabel" style="color:#fde047;font-size:14px;">👑 房主（觀戰轉播）：教師</p>
      <h2 id="lobbyTitle">🌐 等待 5 位學生加入中... (0 / 5)</h2>
      <p style="color:#94a3b8;">連線模式由教師開房觀戰，須等待 <strong>5 位學生全部到齊</strong> 才能開始！</p>
      <div id="lobbyPlayers" class="player-chips"></div>
      <button id="btnStartOnline" class="btn-online" disabled>等待 5 位學生到齊...</button>
      <button id="btnEmergencyStart" class="btn-emergency hidden" disabled>⚠️ 緊急以目前人數開戰</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="controls-hint">移動：↑ ↓ ← → ｜ 瞄準：Z / X ｜ 開火：Space ｜ 觀戰表情：1~4</div>
    <div style="display:flex;gap:8px;">
      <button id="btnReroll" class="btn-secondary hidden">🎲 重新隨機盲盒</button>
      <button id="btnOnlineRestart" class="btn-secondary hidden">🔄 房主重開下一局</button>
      <button id="btnBackMenu" class="btn-secondary hidden">↩ 返回選單</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getDatabase, ref, set, get, onValue, remove, onDisconnect } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
    import { charactersConfig, drawCharacter } from './config/characters.config.js';
    import { normalAttacks, onFireNormal, drawNormalProjectile } from './modules/attacks_normal.js';
    import { specialAttacks, onFireSpecial, drawSpecialProjectile } from './modules/attacks_special.js';
    import { getShrinkZone, drawArenaBackground, drawDangerZone } from './config/arena.config.js';
    import { itemsConfig, drawItem, applyItemEffect } from './modules/items.js';
    import { drawHUD, drawSpectatorOverlay, drawGameOverScreen } from './config/rules.config.js';

    const FIREBASE_DB_URL = 'https://vibe-battle-royale-default-rtdb.asia-southeast1.firebasedatabase.app';
    const firebaseApp = initializeApp({ databaseURL: FIREBASE_DB_URL });
    const db = getDatabase(firebaseApp);

    const CANVAS_W = 800;
    const CANVAS_H = 600;
    const MAX_STUDENTS = 5;
    const PLAYER_RADIUS = 16;
    const ITEM_SPAWN_INTERVAL = 15;
    const MAX_BULLETS_IN_WORLD = 180;
    const MAX_BULLETS_PER_SHOT = 8;
    const SYNC_INTERVAL_MS = 50; // 20Hz 雲端同步節流
    const EMOJI_MAP = {
      Digit1: '👍', Numpad1: '👍',
      Digit2: '🔥', Numpad2: '🔥',
      Digit3: '🍉', Numpad3: '🍉',
      Digit4: '😂', Numpad4: '😂'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const menuOverlay = document.getElementById('menuOverlay');
    const roomSetupOverlay = document.getElementById('roomSetupOverlay');
    const lobbyOverlay = document.getElementById('lobbyOverlay');
    const inputNickname = document.getElementById('inputNickname');
    const inputRoomCode = document.getElementById('inputRoomCode');
    const roomErrorMsg = document.getElementById('roomErrorMsg');
    const lobbyRoomCodeEl = document.getElementById('lobbyRoomCode');
    const lobbyHostLabel = document.getElementById('lobbyHostLabel');
    const lobbyTitle = document.getElementById('lobbyTitle');
    const lobbyPlayersEl = document.getElementById('lobbyPlayers');
    const btnCreateRoom = document.getElementById('btnCreateRoom');
    const btnJoinRoom = document.getElementById('btnJoinRoom');
    const btnCopyInvite = document.getElementById('btnCopyInvite');
    const btnStartOnline = document.getElementById('btnStartOnline');
    const btnEmergencyStart = document.getElementById('btnEmergencyStart');
    const btnReroll = document.getElementById('btnReroll');
    const btnOnlineRestart = document.getElementById('btnOnlineRestart');
    const btnBackMenu = document.getElementById('btnBackMenu');

    const safeNum = (val, fallback) => {
      if (val === null || val === undefined || val === '') return fallback;
      const n = Number(val);
      return Number.isFinite(n) ? n : fallback;
    };
    const clamp = (val, min, max, fallback = min) =>
      Math.min(max, Math.max(min, safeNum(val, fallback)));
    const round1 = (n) => Math.round(n * 10) / 10;

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getSafeCharList() {
      const list = Array.isArray(charactersConfig) && charactersConfig.length > 0
        ? charactersConfig
        : [{ id: 0, name: '預設方塊', color: '#ffffff', hp: 100, speed: 3.5 }];
      return list.map((raw, idx) => ({
        id: raw?.id ?? idx,
        name: String(raw?.name || `角色${idx + 1}`),
        color: raw?.color || '#ffffff',
        hp: clamp(raw?.hp, 60, 160, 100),
        speed: clamp(raw?.speed, 2, 5, 3.5)
      }));
    }

    function getSafeAttackPool() {
      const normals = (Array.isArray(normalAttacks) ? normalAttacks : []).map((raw, idx) => ({
        id: raw?.id ?? idx,
        isSpecial: false,
        name: String(raw?.name || `常規攻擊${idx}`),
        cooldown: clamp(raw?.cooldown, 300, 1200, 500)
      }));
      const specials = (Array.isArray(specialAttacks) ? specialAttacks : []).map((raw, idx) => ({
        id: raw?.id ?? (3 + idx),
        isSpecial: true,
        name: String(raw?.name || `特殊攻擊${idx}`),
        cooldown: clamp(raw?.cooldown, 800, 2500, 1200)
      }));
      const pool = [...normals, ...specials];
      return pool.length > 0
        ? pool
        : [{ id: 0, isSpecial: false, name: '基礎白方塊', cooldown: 500 }];
    }

    function findAttackMeta(attackId, isSpecialHint) {
      const pool = getSafeAttackPool();
      return pool.find((a) => a.id === attackId && a.isSpecial === isSpecialHint)
        || pool.find((a) => a.id === attackId)
        || pool[0];
    }

    // 連線與遊戲狀態
    const myPlayerId = `p-${Math.random().toString(36).slice(2, 8)}-${Date.now().toString(36).slice(-4)}`;
    let appMode = null; // 'practice' | 'online'
    let roomCode = '';
    let isRoomHost = false;
    let roomHostId = '';
    let roomHostName = '教師';
    let roomPlayers = []; // 僅儲存 5 位參賽學生 [{ id, name, joinedAt }]
    let remoteInputs = {}; // { [playerId]: { dx, dy, turn, firing } }
    let unsubscribers = [];
    let world = null;
    let localEmojis = [];
    let lastEmojiSentAt = 0;
    let myEmojiSeq = 0;
    let lastEmojiSyncMap = new Map();
    let lastObservedMatchId = null;
    let staleMatchId = null;
    let lastInputSent = '';
    let lastInputSentAt = 0;
    let lastWorldSyncAt = 0;
    let gameoverSynced = false;
    let lastFrameTime = performance.now();
    let loopRunning = false;
    let isLaunchingMatch = false;

    // 預填預設暱稱與網址房號
    inputNickname.value = `挑戰者${Math.floor(10 + Math.random() * 89)}`;
    const urlParams = new URLSearchParams(window.location.search);
    const initialRoomParam = (urlParams.get('room') || '').trim().toUpperCase();
    if (initialRoomParam) {
      inputRoomCode.value = initialRoomParam;
    }

    // 鍵盤狀態
    const keys = new Set();
    let pendingFire = false;
    function isTypingInField(e) {
      const path = typeof e.composedPath === 'function' ? e.composedPath() : [e.target];
      return path.some((el) =>
        el instanceof HTMLElement &&
        (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable)
      );
    }

    function clearAllKeys() {
      keys.clear();
      pendingFire = false;
      if (appMode === 'online' && roomCode && lastInputSent !== '0|0|0|false') {
        lastInputSent = '0|0|0|false';
        set(ref(db, `rooms/${roomCode}/inputs/${myPlayerId}`), { dx: 0, dy: 0, turn: 0, firing: false }).catch(() => {});
      }
    }

    window.addEventListener('blur', clearAllKeys);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) clearAllKeys();
    });

    window.addEventListener('keydown', (e) => {
      if (isTypingInField(e) || !world || world.phase !== 'playing') return;

      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      keys.add(e.code);
      if (e.code === 'Space') pendingFire = true;

      if (!e.repeat && EMOJI_MAP[e.code]) {
        const myId = appMode === 'practice' ? 'local' : myPlayerId;
        const me = world.players.find((p) => p.id === myId);
        if (me && !me.alive && performance.now() - lastEmojiSentAt > 300) {
          lastEmojiSentAt = performance.now();
          const symbol = EMOJI_MAP[e.code];
          if (appMode === 'practice') {
            spawnFloatingEmoji(symbol, me.name);
          } else if (roomCode) {
            myEmojiSeq += 1;
            set(ref(db, `rooms/${roomCode}/emojis/${myPlayerId}`), {
              symbol,
              name: me.name,
              seq: myEmojiSeq
            }).catch(() => {});
          }
        }
      }
    });
    window.addEventListener('keyup', (e) => keys.delete(e.code));

    function spawnFloatingEmoji(symbol, senderName) {
      localEmojis.push({
        symbol,
        senderName,
        x: 160 + Math.random() * 480,
        y: 520,
        vy: -1.4,
        life: 1800
      });
    }

    // 建立初始世界（Fisher-Yates 洗牌）
    function createInitialWorld(participants) {
      const charPool = shuffle(getSafeCharList());
      const atkPool = shuffle(getSafeAttackPool());
      const total = participants.length;

      const players = participants.map((part, idx) => {
        const safeChar = charPool[idx % charPool.length];
        const safeAtk = atkPool[idx % atkPool.length];
        const angleToCenter = (Math.PI * 2 * idx) / total;
        const spawnR = 220;
        return {
          id: part.id,
          name: part.name,
          isBot: Boolean(part.isBot),
          charId: safeChar.id,
          charName: safeChar.name,
          color: safeChar.color,
          attackId: safeAtk.id,
          isSpecialAttack: safeAtk.isSpecial,
          attackName: safeAtk.name,
          x: round1(400 + Math.cos(angleToCenter) * spawnR),
          y: round1(300 + Math.sin(angleToCenter) * spawnR),
          angle: round1(angleToCenter + Math.PI),
          hp: safeChar.hp,
          maxHp: safeChar.hp,
          baseSpeed: safeChar.speed,
          speedMult: 1,
          speedUntilMs: 0,
          shieldUntilMs: 0,
          isShielded: false,
          lastFireAtMs: -10000,
          kills: 0,
          alive: true,
          eliminatedOrder: 0,
          deathTimeSec: 0,
          preDeathHp: safeChar.hp
        };
      });

      return {
        matchId: `${Date.now()}-${Math.floor(Math.random() * 10000)}`,
        tick: 0,
        phase: 'playing',
        elapsedSec: 0,
        nextItemAt: 5,
        eliminatedCounter: 0,
        players,
        bullets: [],
        items: [],
        zone: { x: 400, y: 300, radius: 420, damagePerSec: 6 },
        ranking: []
      };
    }

    // 主引擎模擬步進
    function stepWorld(dtMs) {
      if (!world || world.phase !== 'playing') return;
      const dtSec = dtMs / 1000;
      const stepScale = dtMs / (1000 / 60);
      world.elapsedSec += dtSec;
      world.tick += 1;
      const worldNowMs = world.elapsedSec * 1000;

      const rawZone = getShrinkZone(world.elapsedSec) || {};
      world.zone = {
        x: round1(clamp(rawZone.x, 100, CANVAS_W - 100, 400)),
        y: round1(clamp(rawZone.y, 100, CANVAS_H - 100, 300)),
        radius: round1(clamp(rawZone.radius, 70, 600, 400)),
        damagePerSec: clamp(rawZone.damagePerSec, 3, 12, 6)
      };

      const safeItems = Array.isArray(itemsConfig) && itemsConfig.length > 0 ? itemsConfig : [{ type: 'HEAL' }];
      if (world.elapsedSec >= world.nextItemAt && world.items.length < 4) {
        world.nextItemAt = world.elapsedSec + ITEM_SPAWN_INTERVAL;
        const r = Math.random() * Math.max(20, world.zone.radius - 30);
        const a = Math.random() * Math.PI * 2;
        const cfg = safeItems[Math.floor(Math.random() * safeItems.length)] || { type: 'HEAL' };
        world.items.push({
          x: round1(clamp(world.zone.x + Math.cos(a) * r, 30, CANVAS_W - 30, 400)),
          y: round1(clamp(world.zone.y + Math.sin(a) * r, 30, CANVAS_H - 30, 300)),
          type: String(cfg.type || 'HEAL')
        });
      }

      for (const p of world.players) {
        if (!p.alive) continue;
        if (worldNowMs > p.speedUntilMs) p.speedMult = 1;
        p.isShielded = worldNowMs < p.shieldUntilMs;

        let dx = 0, dy = 0, turn = 0, firing = false;
        if (p.isBot) {
          p.angle += 0.015 * stepScale;
        } else {
          const inp = appMode === 'practice'
            ? readLocalInput()
            : (p.id === myPlayerId ? readLocalInput() : (remoteInputs[p.id] || {}));
          dx = clamp(inp.dx, -1, 1, 0);
          dy = clamp(inp.dy, -1, 1, 0);
          turn = clamp(inp.turn, -1, 1, 0);
          firing = Boolean(inp.firing);
        }

        const spd = p.baseSpeed * p.speedMult * stepScale;
        const len = Math.hypot(dx, dy) || 1;
        if (dx !== 0 || dy !== 0) {
          p.x = round1(clamp(p.x + (dx / len) * spd, PLAYER_RADIUS + 2, CANVAS_W - PLAYER_RADIUS - 2, p.x));
          p.y = round1(clamp(p.y + (dy / len) * spd, PLAYER_RADIUS + 2, CANVAS_H - PLAYER_RADIUS - 2, p.y));
        }
        p.angle = p.angle + turn * 0.075 * stepScale;

        if (firing) {
          const atk = findAttackMeta(p.attackId, p.isSpecialAttack);
          if (worldNowMs - p.lastFireAtMs >= atk.cooldown) {
            p.lastFireAtMs = worldNowMs;
            let shotTotalDamage = 0;
            let shotBulletCount = 0;
            const maxShotDmg = atk.isSpecial ? 45 : 35;

            const shooterSnapshot = { id: p.id, name: p.name, x: p.x, y: p.y, angle: p.angle, hp: p.hp, maxHp: p.maxHp };
            const spawnBullet = (b) => {
              if (!b || typeof b !== 'object') return;
              if (shotBulletCount >= MAX_BULLETS_PER_SHOT || world.bullets.length >= MAX_BULLETS_IN_WORLD) return;

              const maxVR = atk.isSpecial ? 36 : 20;
              const visualRadius = clamp(b.visualRadius, 2, maxVR, 6);
              const hitRadius = Math.min(visualRadius, clamp(b.hitRadius, 2, maxVR, visualRadius));
              let dmg = clamp(b.damage, 1, maxShotDmg, 10);
              if (shotTotalDamage + dmg > maxShotDmg) dmg = Math.max(0, maxShotDmg - shotTotalDamage);
              if (dmg <= 0) return;

              shotTotalDamage += dmg;
              shotBulletCount += 1;

              const rawBx = safeNum(b.x, p.x);
              const rawBy = safeNum(b.y, p.y);
              const offX = rawBx - p.x;
              const offY = rawBy - p.y;
              const offDist = Math.hypot(offX, offY);
              const bx = offDist > 60 ? p.x + (offX / offDist) * 60 : rawBx;
              const by = offDist > 60 ? p.y + (offY / offDist) * 60 : rawBy;

              const maxSpd = visualRadius > 20 ? 7 : 14;
              world.bullets.push({
                ownerId: p.id,
                isSpecial: atk.isSpecial,
                x: round1(bx),
                y: round1(by),
                vx: clamp(b.vx, -maxSpd, maxSpd, 0),
                vy: clamp(b.vy, -maxSpd, maxSpd, 0),
                damage: dmg,
                lifeTime: clamp(b.lifeTime, 200, 5000, 1500),
                visualRadius,
                hitRadius,
                color: b.color || '#ffffff',
                style: b.style || 'rect'
              });
            };

            if (atk.isSpecial) onFireSpecial(p.attackId, shooterSnapshot, spawnBullet);
            else onFireNormal(p.attackId, shooterSnapshot, spawnBullet);
          }
        }

        const distToZone = Math.hypot(p.x - world.zone.x, p.y - world.zone.y);
        if (distToZone > world.zone.radius && !p.isShielded) {
          p.preDeathHp = p.hp;
          p.hp -= world.zone.damagePerSec * dtSec;
          if (p.hp <= 0) eliminatePlayer(p, null);
        }
      }

      const nextBullets = [];
      for (const b of world.bullets) {
        b.x = round1(b.x + b.vx * stepScale);
        b.y = round1(b.y + b.vy * stepScale);
        b.lifeTime -= dtMs;
        if (b.lifeTime <= 0 || b.x < -40 || b.x > CANVAS_W + 40 || b.y < -40 || b.y > CANVAS_H + 40) continue;

        let hit = false;
        for (const p of world.players) {
          if (!p.alive || p.id === b.ownerId) continue;
          if (Math.hypot(p.x - b.x, p.y - b.y) <= PLAYER_RADIUS + b.hitRadius) {
            hit = true;
            if (!p.isShielded) {
              p.preDeathHp = p.hp;
              p.hp -= b.damage;
              if (p.hp <= 0) eliminatePlayer(p, b.ownerId);
            }
            break;
          }
        }
        if (!hit) nextBullets.push(b);
      }
      world.bullets = nextBullets;

      const nextItems = [];
      for (const it of world.items) {
        let picked = false;
        for (const p of world.players) {
          if (!p.alive || p.isBot) continue;
          if (Math.hypot(p.x - it.x, p.y - it.y) <= PLAYER_RADIUS + 12) {
            picked = true;
            const snapshot = { id: p.id, name: p.name, hp: p.hp, maxHp: p.maxHp };
            const eff = applyItemEffect(snapshot, it.type) || {};
            const healAmt = clamp(eff.heal, 0, 50, 0);
            const shieldMs = clamp(eff.shieldMs, 0, 5000, 0);
            const speedMult = clamp(eff.speedMult, 1, 1.6, 1);
            const speedMs = clamp(eff.speedMs, 0, 5000, 0);
            if (healAmt > 0) p.hp = Math.min(p.maxHp, p.hp + healAmt);
            if (shieldMs > 0) p.shieldUntilMs = worldNowMs + shieldMs;
            if (speedMult > 1 && speedMs > 0) {
              p.speedMult = speedMult;
              p.speedUntilMs = worldNowMs + speedMs;
            }
            break;
          }
        }
        if (!picked) nextItems.push(it);
      }
      world.items = nextItems;

      const alivePlayers = world.players.filter((p) => p.alive);
      const gameOverAliveThreshold = world.players.length <= 1 ? 0 : 1;
      if (alivePlayers.length <= gameOverAliveThreshold) {
        world.phase = 'gameover';
        const sorted = [...world.players].sort((a, b) => {
          if (a.alive !== b.alive) return a.alive ? -1 : 1;
          if (Math.abs(a.deathTimeSec - b.deathTimeSec) > 0.001) return b.deathTimeSec - a.deathTimeSec;
          if (b.preDeathHp !== a.preDeathHp) return b.preDeathHp - a.preDeathHp;
          return b.kills - a.kills;
        });
        let currentRank = 1;
        world.ranking = sorted.map((p, idx) => {
          if (idx > 0) {
            const prev = sorted[idx - 1];
            const tied = !p.alive && !prev.alive && Math.abs(p.deathTimeSec - prev.deathTimeSec) <= 0.001 && p.kills === prev.kills;
            if (!tied) currentRank = idx + 1;
          }
          return {
            name: p.name,
            charName: p.charName,
            kills: p.kills,
            alive: p.alive,
            rank: currentRank
          };
        });
      }
    }

    function eliminatePlayer(victim, killerId) {
      if (!victim.alive) return;
      victim.hp = 0;
      victim.alive = false;
      world.eliminatedCounter += 1;
      victim.eliminatedOrder = world.eliminatedCounter;
      victim.deathTimeSec = round1(world.elapsedSec);
      if (killerId) {
        const killer = world.players.find((p) => p.id === killerId);
        if (killer) killer.kills += 1;
      }
    }

    function readLocalInput() {
      const dx = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0);
      const dy = (keys.has('ArrowDown') ? 1 : 0) - (keys.has('ArrowUp') ? 1 : 0);
      const turn = (keys.has('KeyX') ? 1 : 0) - (keys.has('KeyZ') ? 1 : 0);
      const firing = keys.has('Space') || pendingFire;
      pendingFire = false;
      return { dx, dy, turn, firing };
    }

    function render(dtMs) {
      drawArenaBackground(ctx, CANVAS_W, CANVAS_H);
      if (!world) return;

      drawDangerZone(ctx, world.zone, CANVAS_W, CANVAS_H);
      for (const it of (world.items || [])) drawItem(ctx, it);

      for (const p of (world.players || [])) {
        if (!p.alive) continue;
        drawCharacter(ctx, p);
        ctx.save();
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(p.x - 18, p.y - 28, 36, 5);
        ctx.fillStyle = p.isShielded ? '#38bdf8' : '#22c55e';
        ctx.fillRect(p.x - 18, p.y - 28, 36 * clamp(p.hp / (p.maxHp || 100), 0, 1, 0), 5);
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x, p.y - 32);
        ctx.restore();
      }

      for (const b of (world.bullets || [])) {
        if (b.isSpecial) drawSpecialProjectile(ctx, b);
        else drawNormalProjectile(ctx, b);
      }

      localEmojis = localEmojis.filter((em) => {
        em.y += em.vy * (dtMs / 16.67);
        em.life -= dtMs;
        if (em.life <= 0) return false;
        ctx.save();
        ctx.globalAlpha = Math.min(1, em.life / 600);
        ctx.font = '26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(em.symbol, em.x, em.y);
        ctx.font = '11px sans-serif';
        ctx.fillStyle = '#fde047';
        ctx.fillText(em.senderName, em.x, em.y + 14);
        ctx.restore();
        return true;
      });

      const myId = appMode === 'practice' ? 'local' : myPlayerId;
      const me = (world.players || []).find((p) => p.id === myId);
      const aliveCount = (world.players || []).filter((p) => p.alive).length;

      drawHUD(ctx, {
        mode: appMode,
        elapsedSec: world.elapsedSec,
        aliveCount,
        totalCount: (world.players || []).length,
        me
      });

      if (world.phase === 'playing' && appMode === 'online' && isRoomHost) {
        ctx.save();
        ctx.fillStyle = '#fde047';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('👑 教師觀戰轉播中', CANVAS_W - 14, 24);
        ctx.restore();
      } else if (world.phase === 'playing' && (!me || !me.alive)) {
        drawSpectatorOverlay(ctx, { aliveCount, floatingEmojis: localEmojis });
      }
      if (world.phase === 'gameover') {
        drawGameOverScreen(ctx, world.ranking || []);
        if (appMode === 'online' && isRoomHost) {
          btnOnlineRestart.classList.remove('hidden');
          btnOnlineRestart.disabled = isLaunchingMatch || roomPlayers.length < 1;
        }
      }
    }

    function buildCompactWorld(w) {
      return {
        matchId: w.matchId,
        tick: w.tick,
        phase: w.phase,
        elapsedSec: round1(w.elapsedSec),
        zone: { x: w.zone.x, y: w.zone.y, radius: w.zone.radius },
        items: w.items,
        bullets: w.bullets.map((b) => ({
          isSpecial: b.isSpecial, x: b.x, y: b.y,
          visualRadius: b.visualRadius, color: b.color, style: b.style
        })),
        players: w.players.map((p) => ({
          id: p.id, name: p.name, charName: p.charName, color: p.color,
          attackName: p.attackName, x: p.x, y: p.y, angle: round1(p.angle),
          hp: round1(p.hp), maxHp: p.maxHp, isShielded: p.isShielded,
          kills: p.kills, alive: p.alive
        })),
        ranking: w.ranking
      };
    }

    function gameLoop(now) {
      const dtMs = Math.max(0, Math.min(50, now - lastFrameTime));
      lastFrameTime = now;

      if (appMode === 'practice') {
        stepWorld(dtMs);
      } else if (appMode === 'online' && roomCode) {
        const me = world?.players?.find((p) => p.id === myPlayerId);
        if (!isRoomHost && world?.phase === 'playing' && me?.alive) {
          const inp = readLocalInput();
          const sig = `${inp.dx}|${inp.dy}|${inp.turn}|${inp.firing}`;
          if (sig !== lastInputSent || now - lastInputSentAt > 120) {
            lastInputSent = sig;
            lastInputSentAt = now;
            set(ref(db, `rooms/${roomCode}/inputs/${myPlayerId}`), inp).catch(() => {});
          }
        }

        if (isRoomHost && world) {
          if (world.phase === 'playing') {
            stepWorld(dtMs);
            if (world.phase === 'gameover') {
              gameoverSynced = true;
              set(ref(db, `rooms/${roomCode}/world`), buildCompactWorld(world)).catch(() => {});
            } else if (now - lastWorldSyncAt >= SYNC_INTERVAL_MS) {
              lastWorldSyncAt = now;
              set(ref(db, `rooms/${roomCode}/world`), buildCompactWorld(world)).catch(() => {});
            }
          } else if (!gameoverSynced) {
            gameoverSynced = true;
            set(ref(db, `rooms/${roomCode}/world`), buildCompactWorld(world)).catch(() => {});
          }
        }
      }

      render(dtMs);
      if (loopRunning) requestAnimationFrame(gameLoop);
    }

    // 練習模式
    function startPractice() {
      document.activeElement?.blur();
      appMode = 'practice';
      keys.clear();
      pendingFire = false;
      localEmojis = [];
      menuOverlay.classList.add('hidden');
      roomSetupOverlay.classList.add('hidden');
      lobbyOverlay.classList.add('hidden');
      btnReroll.classList.remove('hidden');
      btnOnlineRestart.classList.add('hidden');
      btnBackMenu.classList.remove('hidden');

      world = createInitialWorld([
        { id: 'local', name: '我（教師／學生）', isBot: false },
        { id: 'bot-1', name: '標靶 A', isBot: true },
        { id: 'bot-2', name: '標靶 B', isBot: true }
      ]);

      if (!loopRunning) {
        loopRunning = true;
        lastFrameTime = performance.now();
        requestAnimationFrame(gameLoop);
      }
    }

    // 連線模式入口
    function openRoomSetup() {
      appMode = 'online';
      menuOverlay.classList.add('hidden');
      roomSetupOverlay.classList.remove('hidden');
      btnBackMenu.classList.remove('hidden');
      roomErrorMsg.textContent = '';
    }

    async function enterFirebaseRoom(code, createAsHost) {
      const nick = (inputNickname.value || '').trim() || `玩家${Math.floor(10 + Math.random() * 89)}`;
      roomErrorMsg.style.color = '#38bdf8';
      roomErrorMsg.textContent = '連線至房間中，請稍候...';
      btnCreateRoom.disabled = true;
      btnJoinRoom.disabled = true;

      try {
        const roomSnap = await get(ref(db, `rooms/${code}`));
        const roomData = roomSnap.val();

        if (createAsHost) {
          isRoomHost = true;
          roomHostId = myPlayerId;
          roomHostName = nick;
          await set(ref(db, `rooms/${code}`), {
            hostId: myPlayerId,
            hostName: nick,
            createdAt: Date.now()
          });
        } else {
          if (!roomData || !roomData.hostId) {
            roomErrorMsg.style.color = '#f87171';
            roomErrorMsg.textContent = `找不到房號「${code}」，請確認房號是否正確！`;
            return;
          }
          const currentPlayers = roomData.players ? Object.values(roomData.players) : [];
          if (currentPlayers.length >= MAX_STUDENTS) {
            roomErrorMsg.style.color = '#f87171';
            roomErrorMsg.textContent = `房間「${code}」已滿 ${MAX_STUDENTS} 位學生，無法再加入！`;
            return;
          }
          isRoomHost = false;
          roomHostId = roomData.hostId;
          roomHostName = roomData.hostName || '教師';
        }

        roomCode = code;
        if (!isRoomHost) {
          const myPlayerRef = ref(db, `rooms/${code}/players/${myPlayerId}`);
          await onDisconnect(myPlayerRef).remove();
          await set(myPlayerRef, { id: myPlayerId, name: nick, joinedAt: Date.now() });
          await onDisconnect(ref(db, `rooms/${code}/inputs/${myPlayerId}`)).remove();
        }

        // 更新網址方便複製分享
        history.replaceState(null, '', `${window.location.pathname}?room=${code}`);
        lobbyRoomCodeEl.textContent = code;
        roomPlayers = [];
        updateLobbyUI();
        roomSetupOverlay.classList.add('hidden');
        lobbyOverlay.classList.remove('hidden');

        staleMatchId = roomData?.world?.phase === 'gameover' ? roomData.world.matchId : null;
        bindRoomListeners(code);
      } catch (err) {
        roomErrorMsg.textContent = `連線 Firebase 失敗：${err?.message || err}`;
      } finally {
        btnCreateRoom.disabled = false;
        btnJoinRoom.disabled = false;
      }
    }

    function bindRoomListeners(code) {
      unsubscribers.forEach((u) => u());
      unsubscribers = [];

      // 1. 監聽房間玩家清單（滿 5 人解鎖）
      unsubscribers.push(onValue(ref(db, `rooms/${code}/players`), (snap) => {
        const val = snap.val() || {};
        roomPlayers = Object.values(val).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
        // 若對戰中有人斷線，由 Host 淘汰
        if (isRoomHost && world?.phase === 'playing') {
          const activeIds = new Set(roomPlayers.map((rp) => rp.id));
          for (const wp of world.players) {
            if (wp.alive && !activeIds.has(wp.id)) eliminatePlayer(wp, null);
          }
        }
        updateLobbyUI();
      }));

      // 2. 房主監聽所有玩家輸入
      if (isRoomHost) {
        unsubscribers.push(onValue(ref(db, `rooms/${code}/inputs`), (snap) => {
          remoteInputs = snap.val() || {};
        }));
      } else {
        // 3. 非房主監聽 Host 廣播的世界狀態
        unsubscribers.push(onValue(ref(db, `rooms/${code}/world`), (snap) => {
          const synced = snap.val();
          if (!synced || !synced.phase) return;
          if (synced.matchId === staleMatchId) return;

          const isNewMatch = synced.matchId !== lastObservedMatchId;
          if (isNewMatch || !world || synced.tick >= world.tick) {
            if (isNewMatch) {
              document.activeElement?.blur();
              lastObservedMatchId = synced.matchId;
              keys.clear();
              pendingFire = false;
              localEmojis = [];
              btnOnlineRestart.classList.add('hidden');
              lobbyOverlay.classList.add('hidden');
              if (!loopRunning) {
                loopRunning = true;
                lastFrameTime = performance.now();
                requestAnimationFrame(gameLoop);
              }
            }
            world = synced;
          }
        }));
      }

      // 4. 所有人監聽觀戰加油表情
      unsubscribers.push(onValue(ref(db, `rooms/${code}/emojis`), (snap) => {
        const map = snap.val() || {};
        for (const [pid, ev] of Object.entries(map)) {
          if (ev && ev.seq && ev.seq !== lastEmojiSyncMap.get(pid)) {
            lastEmojiSyncMap.set(pid, ev.seq);
            spawnFloatingEmoji(ev.symbol, ev.name || '玩家');
          }
        }
      }));
    }

    function updateLobbyUI() {
      const count = roomPlayers.length;
      lobbyHostLabel.textContent = `👑 房主（觀戰轉播）：${roomHostName}`;
      lobbyTitle.textContent = `🌐 等待 ${MAX_STUDENTS} 位學生加入中... (${count} / ${MAX_STUDENTS})`;
      lobbyPlayersEl.innerHTML = '';
      roomPlayers.forEach((p, i) => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = `學生 ${i + 1}: ${p.name}`;
        lobbyPlayersEl.appendChild(chip);
      });

      const full = count >= MAX_STUDENTS;
      btnStartOnline.disabled = !(isRoomHost && full) || isLaunchingMatch;
      if (!full) btnStartOnline.textContent = `還差 ${MAX_STUDENTS - count} 位學生才能開始...`;
      else if (!isRoomHost) btnStartOnline.textContent = `已滿 ${MAX_STUDENTS} 位學生！等待老師點擊開始...`;
      else btnStartOnline.textContent = `🚀 ${MAX_STUDENTS} 位學生已到齊！啟動盲盒大逃殺`;

      const showEmergency = isRoomHost && count >= 1 && count < MAX_STUDENTS;
      btnEmergencyStart.classList.toggle('hidden', !showEmergency);
      btnEmergencyStart.disabled = !showEmergency || isLaunchingMatch;
      if (showEmergency) {
        btnEmergencyStart.textContent = `⚠️ 緊急以目前人數開戰（${count} 人）`;
      }
    }

    async function launchOnlineMatch({ allowPartial = false } = {}) {
      if (isLaunchingMatch || !isRoomHost || !roomCode) return;
      const minPlayers = allowPartial === true ? 1 : MAX_STUDENTS;
      if (roomPlayers.length < minPlayers) return;

      isLaunchingMatch = true;
      document.activeElement?.blur();
      btnStartOnline.disabled = true;
      btnEmergencyStart.disabled = true;
      btnOnlineRestart.disabled = true;
      btnOnlineRestart.classList.add('hidden');
      keys.clear();
      pendingFire = false;
      localEmojis = [];
      lastEmojiSyncMap.clear();
      gameoverSynced = false;

      try {
        await set(ref(db, `rooms/${roomCode}/emojis`), null).catch(() => {});
        const participants = roomPlayers.slice(0, MAX_STUDENTS).map((p, idx) => ({
          id: p.id,
          name: p.name || `玩家${idx + 1}`,
          isBot: false
        }));
        if (participants.length < minPlayers) return;

        world = createInitialWorld(participants);
        lastObservedMatchId = world.matchId;
        lobbyOverlay.classList.add('hidden');
        await set(ref(db, `rooms/${roomCode}/world`), buildCompactWorld(world));

        if (!loopRunning) {
          loopRunning = true;
          lastFrameTime = performance.now();
          requestAnimationFrame(gameLoop);
        }
      } finally {
        isLaunchingMatch = false;
        btnOnlineRestart.disabled = false;
        updateLobbyUI();
      }
    }

    btnCreateRoom.addEventListener('click', () => {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
      enterFirebaseRoom(code, true);
    });

    btnJoinRoom.addEventListener('click', () => {
      const code = (inputRoomCode.value || '').trim().toUpperCase();
      if (!code) {
        roomErrorMsg.textContent = '請輸入房號！';
        return;
      }
      enterFirebaseRoom(code, false);
    });

    btnCopyInvite.addEventListener('click', async () => {
      const url = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
      try {
        await navigator.clipboard.writeText(url);
        btnCopyInvite.textContent = '✅ 已複製連結';
        setTimeout(() => { btnCopyInvite.textContent = '📋 複製邀請連結'; }, 1800);
      } catch {
        prompt('請複製此邀請連結分享給同學：', url);
      }
    });

    btnStartOnline.addEventListener('click', () => launchOnlineMatch({ allowPartial: false }));
    btnEmergencyStart.addEventListener('click', () => launchOnlineMatch({ allowPartial: true }));
    btnOnlineRestart.addEventListener('click', () => launchOnlineMatch({ allowPartial: true }));
    document.getElementById('btnPractice').addEventListener('click', startPractice);
    document.getElementById('btnOnline').addEventListener('click', openRoomSetup);
    btnReroll.addEventListener('click', startPractice);
    btnBackMenu.addEventListener('click', async () => {
      if (roomCode && !isRoomHost) {
        await remove(ref(db, `rooms/${roomCode}/players/${myPlayerId}`)).catch(() => {});
      }
      history.replaceState(null, '', window.location.pathname);
      window.location.reload();
    });
  </script>
</body>
