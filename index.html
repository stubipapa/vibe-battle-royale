<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6人連線萬物大逃殺 - Vibe Coding 課堂版</title>
  <script src="https://unpkg.com/playroomkit/multiplayer.full.umd.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
      padding: 16px;
    }
    h1 { font-size: 20px; letter-spacing: 0.5px; color: #fde047; text-align: center; }
    .stage-wrap {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 800 / 600;
      border: 3px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      background: #1e293b;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    canvas { display: block; width: 100%; height: 100%; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      text-align: center;
      overflow-y: auto;
    }
    @media (max-width: 600px) {
      .overlay { justify-content: flex-start; gap: 10px; padding: 12px; }
      .overlay h2 { font-size: 18px; }
      button { padding: 10px 16px; font-size: 14px; }
    }
    .hidden { display: none !important; }
    .mode-btns { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      transition: transform 0.1s, opacity 0.15s;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-practice { background: #22c55e; color: #052e16; }
    .btn-online { background: #3b82f6; color: #eff6ff; }
    .btn-secondary { background: #475569; color: #f8fafc; padding: 8px 16px; font-size: 14px; }
    .controls-hint {
      font-size: 13px;
      color: #cbd5e1;
      background: #1e293b;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .toolbar {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #94a3b8;
    }
    .player-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 560px; }
    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      background: #1e293b;
      border: 1px solid #475569;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>🎮 6人連線萬物大逃殺（盲盒開局）</h1>

  <div class="stage-wrap">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- 入口模式選擇畫面 -->
    <div id="menuOverlay" class="overlay">
      <h2>請選擇遊戲模式</h2>
      <p style="color:#94a3b8;max-width:480px;line-height:1.6;">
        開局前沒有人知道自己的角色、武器與道具功能！<br />
        系統將於開戰瞬間隨機分配「盲盒組合」。
      </p>
      <div class="mode-btns">
        <button id="btnPractice" class="btn-practice">🧪 練習模式（單人示範／測試）</button>
        <button id="btnOnline" class="btn-online">🌐 連線模式（須滿 6 人開戰）</button>
      </div>
      <div class="controls-hint">
        操作：<strong>↑ ↓ ← →</strong> 移動 ｜ <strong>Z / X</strong> 逆／順時針瞄準 ｜ <strong>Space</strong> 開火
      </div>
    </div>

    <!-- 連線等待 6 人大廳 -->
    <div id="lobbyOverlay" class="overlay hidden">
      <h2 id="lobbyTitle">🌐 等待玩家加入中... (0 / 6)</h2>
      <p style="color:#94a3b8;">連線模式必須等待 <strong>6 位玩家全部到齊</strong> 才能開始盲盒大逃殺！</p>
      <div id="lobbyPlayers" class="player-chips"></div>
      <button id="btnStartOnline" class="btn-online" disabled>等待 6 人到齊...</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="controls-hint">移動：↑ ↓ ← → ｜ 瞄準：Z / X ｜ 開火：Space ｜ 觀戰表情：1~4</div>
    <div style="display:flex;gap:8px;">
      <button id="btnReroll" class="btn-secondary hidden">🎲 重新隨機盲盒</button>
      <button id="btnOnlineRestart" class="btn-secondary hidden">🔄 房主重開下一局</button>
      <button id="btnBackMenu" class="btn-secondary hidden">↩ 返回選單</button>
    </div>
  </div>

  <script type="module">
    import { charactersConfig, drawCharacter } from './config/characters.config.js';
    import { normalAttacks, onFireNormal, drawNormalProjectile } from './modules/attacks_normal.js';
    import { specialAttacks, onFireSpecial, drawSpecialProjectile } from './modules/attacks_special.js';
    import { getShrinkZone, drawArenaBackground, drawDangerZone } from './config/arena.config.js';
    import { itemsConfig, drawItem, applyItemEffect } from './modules/items.js';
    import { drawHUD, drawSpectatorOverlay, drawGameOverScreen } from './config/rules.config.js';

    // 若 Playroom 出現每日共用配額上限，請至 https://dev.joinplayroom.com 免費建立專案並填入 gameId
    const PLAYROOM_GAME_ID = '';

    const CANVAS_W = 800;
    const CANVAS_H = 600;
    const PLAYER_RADIUS = 16;
    const ITEM_SPAWN_INTERVAL = 15;
    const MAX_BULLETS_IN_WORLD = 180;
    const MAX_BULLETS_PER_SHOT = 8;
    const SYNC_INTERVAL_MS = 40; // ~25Hz 同步節流
    const EMOJI_MAP = {
      Digit1: '👍', Numpad1: '👍',
      Digit2: '🔥', Numpad2: '🔥',
      Digit3: '🍉', Numpad3: '🍉',
      Digit4: '😂', Numpad4: '😂'
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const menuOverlay = document.getElementById('menuOverlay');
    const lobbyOverlay = document.getElementById('lobbyOverlay');
    const lobbyTitle = document.getElementById('lobbyTitle');
    const lobbyPlayersEl = document.getElementById('lobbyPlayers');
    const btnPractice = document.getElementById('btnPractice');
    const btnOnline = document.getElementById('btnOnline');
    const btnStartOnline = document.getElementById('btnStartOnline');
    const btnReroll = document.getElementById('btnReroll');
    const btnOnlineRestart = document.getElementById('btnOnlineRestart');
    const btnBackMenu = document.getElementById('btnBackMenu');

    const safeNum = (val, fallback) => {
      if (val === null || val === undefined || val === '') return fallback;
      const n = Number(val);
      return Number.isFinite(n) ? n : fallback;
    };
    const clamp = (val, min, max, fallback = min) =>
      Math.min(max, Math.max(min, safeNum(val, fallback)));
    const round1 = (n) => Math.round(n * 10) / 10;

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getSafeCharList() {
      const list = Array.isArray(charactersConfig) && charactersConfig.length > 0
        ? charactersConfig
        : [{ id: 0, name: '預設方塊', color: '#ffffff', hp: 100, speed: 3.5 }];
      return list.map((raw, idx) => ({
        id: raw?.id ?? idx,
        name: String(raw?.name || `角色${idx + 1}`),
        color: raw?.color || '#ffffff',
        hp: clamp(raw?.hp, 60, 160, 100),
        speed: clamp(raw?.speed, 2, 5, 3.5)
      }));
    }

    function getSafeAttackPool() {
      const normals = (Array.isArray(normalAttacks) ? normalAttacks : []).map((raw, idx) => ({
        id: raw?.id ?? idx,
        isSpecial: false,
        name: String(raw?.name || `常規攻擊${idx}`),
        cooldown: clamp(raw?.cooldown, 300, 1200, 500)
      }));
      const specials = (Array.isArray(specialAttacks) ? specialAttacks : []).map((raw, idx) => ({
        id: raw?.id ?? (3 + idx),
        isSpecial: true,
        name: String(raw?.name || `特殊攻擊${idx}`),
        cooldown: clamp(raw?.cooldown, 800, 2500, 1200)
      }));
      const pool = [...normals, ...specials];
      return pool.length > 0
        ? pool
        : [{ id: 0, isSpecial: false, name: '基礎白方塊', cooldown: 500 }];
    }

    function findAttackMeta(attackId, isSpecialHint) {
      const pool = getSafeAttackPool();
      return pool.find((a) => a.id === attackId && a.isSpecial === isSpecialHint)
        || pool.find((a) => a.id === attackId)
        || pool[0];
    }

    // 狀態變數
    let appMode = null; // 'practice' | 'online'
    let onlineStarting = false;
    let joinListenerBound = false;
    let playroomPlayers = [];
    let world = null;
    let localEmojis = [];
    let lastEmojiSentAt = 0;
    let myEmojiSeq = 0;
    let lastEmojiSyncMap = new Map();
    let lastObservedMatchId = null;
    let lastLobbySnapshot = '';
    let lastInputSent = '';
    let lastInputSentAt = 0;
    let lastWorldSyncAt = 0;
    let gameoverSynced = false;
    let lastFrameTime = performance.now();
    let loopRunning = false;

    // 鍵盤狀態（僅在對戰中且非輸入框時攔截）
    const keys = new Set();
    function isTypingInField(e) {
      const path = typeof e.composedPath === 'function' ? e.composedPath() : [e.target];
      return path.some((el) =>
        el instanceof HTMLElement &&
        (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable)
      );
    }

    function clearAllKeys() {
      keys.clear();
      if (appMode === 'online' && window.Playroom && lastInputSent !== '0|0|0|false') {
        lastInputSent = '0|0|0|false';
        window.Playroom.myPlayer()?.setState('input', { dx: 0, dy: 0, turn: 0, firing: false });
      }
    }

    window.addEventListener('blur', clearAllKeys);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) clearAllKeys();
    });

    window.addEventListener('keydown', (e) => {
      if (isTypingInField(e) || !world || world.phase !== 'playing') return;

      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      keys.add(e.code);

      if (!e.repeat && EMOJI_MAP[e.code]) {
        const myId = appMode === 'practice' ? 'local' : window.Playroom?.myPlayer()?.id;
        const me = world.players.find((p) => p.id === myId);
        if (me && !me.alive && performance.now() - lastEmojiSentAt > 600) {
          lastEmojiSentAt = performance.now();
          const symbol = EMOJI_MAP[e.code];
          if (appMode === 'practice') {
            spawnFloatingEmoji(symbol, me.name);
          } else if (window.Playroom) {
            myEmojiSeq += 1;
            window.Playroom.myPlayer().setState('emojiEvent', { symbol, name: me.name, seq: myEmojiSeq }, true);
          }
        }
      }
    });
    window.addEventListener('keyup', (e) => keys.delete(e.code));

    function spawnFloatingEmoji(symbol, senderName) {
      localEmojis.push({
        symbol,
        senderName,
        x: 160 + Math.random() * 480,
        y: 520,
        vy: -1.4,
        life: 1800
      });
    }

    // 建立初始世界（採用 Fisher-Yates 洗牌，確保 6 人盲盒盡量不重複）
    function createInitialWorld(participants) {
      const charPool = shuffle(getSafeCharList());
      const atkPool = shuffle(getSafeAttackPool());
      const total = participants.length;

      const players = participants.map((part, idx) => {
        const safeChar = charPool[idx % charPool.length];
        const safeAtk = atkPool[idx % atkPool.length];
        const angleToCenter = (Math.PI * 2 * idx) / total;
        const spawnR = 220;
        return {
          id: part.id,
          name: part.name,
          isBot: Boolean(part.isBot),
          charId: safeChar.id,
          charName: safeChar.name,
          color: safeChar.color,
          attackId: safeAtk.id,
          isSpecialAttack: safeAtk.isSpecial,
          attackName: safeAtk.name,
          x: round1(400 + Math.cos(angleToCenter) * spawnR),
          y: round1(300 + Math.sin(angleToCenter) * spawnR),
          angle: round1(angleToCenter + Math.PI),
          hp: safeChar.hp,
          maxHp: safeChar.hp,
          baseSpeed: safeChar.speed,
          speedMult: 1,
          speedUntilMs: 0,
          shieldUntilMs: 0,
          isShielded: false,
          lastFireAtMs: -10000,
          kills: 0,
          alive: true,
          eliminatedOrder: 0,
          deathTimeSec: 0,
          preDeathHp: safeChar.hp
        };
      });

      return {
        matchId: `${Date.now()}-${Math.floor(Math.random() * 10000)}`,
        tick: 0,
        phase: 'playing',
        elapsedSec: 0,
        nextItemAt: 5,
        eliminatedCounter: 0,
        players,
        bullets: [],
        items: [],
        zone: { x: 400, y: 300, radius: 420, damagePerSec: 6 },
        ranking: []
      };
    }

    // 主引擎模擬步進（僅 Host 或練習模式執行）
    function stepWorld(dtMs) {
      if (!world || world.phase !== 'playing') return;
      const dtSec = dtMs / 1000;
      const stepScale = dtMs / (1000 / 60); // 鎖定 60FPS 物理基準（支援 120Hz 螢幕）
      world.elapsedSec += dtSec;
      world.tick += 1;
      const worldNowMs = world.elapsedSec * 1000;

      // 1. 縮圈計算與數值護欄
      const rawZone = getShrinkZone(world.elapsedSec) || {};
      world.zone = {
        x: round1(clamp(rawZone.x, 100, CANVAS_W - 100, 400)),
        y: round1(clamp(rawZone.y, 100, CANVAS_H - 100, 300)),
        radius: round1(clamp(rawZone.radius, 70, 600, 400)),
        damagePerSec: clamp(rawZone.damagePerSec, 3, 12, 6)
      };

      // 2. 道具定時生成（安全區內）
      const safeItems = Array.isArray(itemsConfig) && itemsConfig.length > 0 ? itemsConfig : [{ type: 'HEAL' }];
      if (world.elapsedSec >= world.nextItemAt && world.items.length < 4) {
        world.nextItemAt = world.elapsedSec + ITEM_SPAWN_INTERVAL;
        const r = Math.random() * Math.max(20, world.zone.radius - 30);
        const a = Math.random() * Math.PI * 2;
        const cfg = safeItems[Math.floor(Math.random() * safeItems.length)] || { type: 'HEAL' };
        world.items.push({
          x: round1(clamp(world.zone.x + Math.cos(a) * r, 30, CANVAS_W - 30, 400)),
          y: round1(clamp(world.zone.y + Math.sin(a) * r, 30, CANVAS_H - 30, 300)),
          type: String(cfg.type || 'HEAL')
        });
      }

      // 3. 處理玩家移動、瞄準、開火與圈外扣血
      for (const p of world.players) {
        if (!p.alive) continue;

        if (worldNowMs > p.speedUntilMs) p.speedMult = 1;
        p.isShielded = worldNowMs < p.shieldUntilMs;

        let dx = 0;
        let dy = 0;
        let turn = 0;
        let firing = false;

        if (p.isBot) {
          p.angle += 0.015 * stepScale;
        } else {
          const inp = appMode === 'practice'
            ? readLocalInput()
            : (playroomPlayers.find((pp) => pp.id === p.id)?.getState('input') || {});
          dx = clamp(inp.dx, -1, 1, 0);
          dy = clamp(inp.dy, -1, 1, 0);
          turn = clamp(inp.turn, -1, 1, 0);
          firing = Boolean(inp.firing);
        }

        const spd = p.baseSpeed * p.speedMult * stepScale;
        const len = Math.hypot(dx, dy) || 1;
        if (dx !== 0 || dy !== 0) {
          p.x = round1(clamp(p.x + (dx / len) * spd, PLAYER_RADIUS, CANVAS_W - PLAYER_RADIUS, p.x));
          p.y = round1(clamp(p.y + (dy / len) * spd, PLAYER_RADIUS, CANVAS_H - PLAYER_RADIUS, p.y));
        }
        p.angle = p.angle + turn * 0.075 * stepScale;

        // 開火與數值護欄（唯讀快照 + hitRadius <= visualRadius 鐵則）
        if (firing) {
          const atk = findAttackMeta(p.attackId, p.isSpecialAttack);
          if (worldNowMs - p.lastFireAtMs >= atk.cooldown) {
            p.lastFireAtMs = worldNowMs;
            let shotTotalDamage = 0;
            let shotBulletCount = 0;
            const maxShotDmg = atk.isSpecial ? 45 : 35;

            const shooterSnapshot = { id: p.id, name: p.name, x: p.x, y: p.y, angle: p.angle, hp: p.hp, maxHp: p.maxHp };
            const spawnBullet = (b) => {
              if (!b || typeof b !== 'object') return;
              if (shotBulletCount >= MAX_BULLETS_PER_SHOT || world.bullets.length >= MAX_BULLETS_IN_WORLD) return;

              const maxVR = atk.isSpecial ? 36 : 20;
              const visualRadius = clamp(b.visualRadius, 2, maxVR, 6);
              const hitRadius = Math.min(visualRadius, clamp(b.hitRadius, 2, maxVR, visualRadius));
              let dmg = clamp(b.damage, 1, maxShotDmg, 10);
              if (shotTotalDamage + dmg > maxShotDmg) dmg = Math.max(0, maxShotDmg - shotTotalDamage);
              if (dmg <= 0) return;

              shotTotalDamage += dmg;
              shotBulletCount += 1;

              // 限制子彈生成點不可瞬移至距離射手超過 60px
              const rawBx = safeNum(b.x, p.x);
              const rawBy = safeNum(b.y, p.y);
              const offX = rawBx - p.x;
              const offY = rawBy - p.y;
              const offDist = Math.hypot(offX, offY);
              const bx = offDist > 60 ? p.x + (offX / offDist) * 60 : rawBx;
              const by = offDist > 60 ? p.y + (offY / offDist) * 60 : rawBy;

              // 大型特殊武器速度依半徑微幅限制
              const maxSpd = visualRadius > 20 ? 7 : 14;
              world.bullets.push({
                ownerId: p.id,
                isSpecial: atk.isSpecial,
                x: round1(bx),
                y: round1(by),
                vx: clamp(b.vx, -maxSpd, maxSpd, 0),
                vy: clamp(b.vy, -maxSpd, maxSpd, 0),
                damage: dmg,
                lifeTime: clamp(b.lifeTime, 200, 5000, 1500),
                visualRadius,
                hitRadius,
                color: b.color || '#ffffff',
                style: b.style || 'rect'
              });
            };

            if (atk.isSpecial) onFireSpecial(p.attackId, shooterSnapshot, spawnBullet);
            else onFireNormal(p.attackId, shooterSnapshot, spawnBullet);
          }
        }

        // 圈外扣血
        const distToZone = Math.hypot(p.x - world.zone.x, p.y - world.zone.y);
        if (distToZone > world.zone.radius && !p.isShielded) {
          p.preDeathHp = p.hp;
          p.hp -= world.zone.damagePerSec * dtSec;
          if (p.hp <= 0) eliminatePlayer(p, null);
        }
      }

      // 4. 更新子彈與碰撞判定
      const nextBullets = [];
      for (const b of world.bullets) {
        b.x = round1(b.x + b.vx * stepScale);
        b.y = round1(b.y + b.vy * stepScale);
        b.lifeTime -= dtMs;
        if (b.lifeTime <= 0 || b.x < -40 || b.x > CANVAS_W + 40 || b.y < -40 || b.y > CANVAS_H + 40) continue;

        let hit = false;
        for (const p of world.players) {
          if (!p.alive || p.id === b.ownerId) continue;
          if (Math.hypot(p.x - b.x, p.y - b.y) <= PLAYER_RADIUS + b.hitRadius) {
            hit = true;
            if (!p.isShielded) {
              p.preDeathHp = p.hp;
              p.hp -= b.damage;
              if (p.hp <= 0) eliminatePlayer(p, b.ownerId);
            }
            break;
          }
        }
        if (!hit) nextBullets.push(b);
      }
      world.bullets = nextBullets;

      // 5. 道具碰撞拾取與護欄
      const nextItems = [];
      for (const it of world.items) {
        let picked = false;
        for (const p of world.players) {
          if (!p.alive || p.isBot) continue;
          if (Math.hypot(p.x - it.x, p.y - it.y) <= PLAYER_RADIUS + 12) {
            picked = true;
            const snapshot = { id: p.id, name: p.name, hp: p.hp, maxHp: p.maxHp };
            const eff = applyItemEffect(snapshot, it.type) || {};
            const healAmt = clamp(eff.heal, 0, 50, 0);
            const shieldMs = clamp(eff.shieldMs, 0, 5000, 0);
            const speedMult = clamp(eff.speedMult, 1, 1.6, 1);
            const speedMs = clamp(eff.speedMs, 0, 5000, 0);
            if (healAmt > 0) p.hp = Math.min(p.maxHp, p.hp + healAmt);
            if (shieldMs > 0) p.shieldUntilMs = worldNowMs + shieldMs;
            if (speedMult > 1 && speedMs > 0) {
              p.speedMult = speedMult;
              p.speedUntilMs = worldNowMs + speedMs;
            }
            break;
          }
        }
        if (!picked) nextItems.push(it);
      }
      world.items = nextItems;

      // 6. 大逃殺勝負判定（支援同幀死亡排序與並列名次）
      const alivePlayers = world.players.filter((p) => p.alive);
      if (alivePlayers.length <= 1) {
        world.phase = 'gameover';
        const sorted = [...world.players].sort((a, b) => {
          if (a.alive !== b.alive) return a.alive ? -1 : 1;
          if (Math.abs(a.deathTimeSec - b.deathTimeSec) > 0.001) return b.deathTimeSec - a.deathTimeSec;
          if (b.preDeathHp !== a.preDeathHp) return b.preDeathHp - a.preDeathHp;
          return b.kills - a.kills;
        });
        let currentRank = 1;
        world.ranking = sorted.map((p, idx) => {
          if (idx > 0) {
            const prev = sorted[idx - 1];
            const tied = !p.alive && !prev.alive && Math.abs(p.deathTimeSec - prev.deathTimeSec) <= 0.001 && p.kills === prev.kills;
            if (!tied) currentRank = idx + 1;
          }
          return {
            name: p.name,
            charName: p.charName,
            kills: p.kills,
            alive: p.alive,
            rank: currentRank
          };
        });
      }
    }

    function eliminatePlayer(victim, killerId) {
      if (!victim.alive) return;
      victim.hp = 0;
      victim.alive = false;
      world.eliminatedCounter += 1;
      victim.eliminatedOrder = world.eliminatedCounter;
      victim.deathTimeSec = round1(world.elapsedSec);
      if (killerId) {
        const killer = world.players.find((p) => p.id === killerId);
        if (killer) killer.kills += 1;
      }
    }

    function readLocalInput() {
      const dx = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0);
      const dy = (keys.has('ArrowDown') ? 1 : 0) - (keys.has('ArrowUp') ? 1 : 0);
      const turn = (keys.has('KeyX') ? 1 : 0) - (keys.has('KeyZ') ? 1 : 0);
      const firing = keys.has('Space');
      return { dx, dy, turn, firing };
    }

    // 畫面渲染（每台筆電本機執行）
    function render(dtMs) {
      drawArenaBackground(ctx, CANVAS_W, CANVAS_H);
      if (!world) return;

      drawDangerZone(ctx, world.zone, CANVAS_W, CANVAS_H);

      for (const it of world.items) drawItem(ctx, it);

      for (const p of world.players) {
        if (!p.alive) continue;
        drawCharacter(ctx, p);
        ctx.save();
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(p.x - 18, p.y - 28, 36, 5);
        ctx.fillStyle = p.isShielded ? '#38bdf8' : '#22c55e';
        ctx.fillRect(p.x - 18, p.y - 28, 36 * clamp(p.hp / (p.maxHp || 100), 0, 1, 0), 5);
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p.name, p.x, p.y - 32);
        ctx.restore();
      }

      for (const b of world.bullets) {
        if (b.isSpecial) drawSpecialProjectile(ctx, b);
        else drawNormalProjectile(ctx, b);
      }

      // 飄浮加油表情（時間步長無關）
      localEmojis = localEmojis.filter((em) => {
        em.y += em.vy * (dtMs / 16.67);
        em.life -= dtMs;
        if (em.life <= 0) return false;
        ctx.save();
        ctx.globalAlpha = Math.min(1, em.life / 600);
        ctx.font = '26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(em.symbol, em.x, em.y);
        ctx.font = '11px sans-serif';
        ctx.fillStyle = '#fde047';
        ctx.fillText(em.senderName, em.x, em.y + 14);
        ctx.restore();
        return true;
      });

      const myId = appMode === 'practice' ? 'local' : window.Playroom?.myPlayer()?.id;
      const me = world.players.find((p) => p.id === myId);
      const aliveCount = world.players.filter((p) => p.alive).length;

      drawHUD(ctx, {
        mode: appMode,
        elapsedSec: world.elapsedSec,
        aliveCount,
        totalCount: world.players.length,
        me
      });

      if (world.phase === 'playing' && (!me || !me.alive)) {
        drawSpectatorOverlay(ctx, { aliveCount, floatingEmojis: localEmojis });
      }
      if (world.phase === 'gameover') {
        drawGameOverScreen(ctx, world.ranking);
        if (appMode === 'online' && window.Playroom?.isHost()) {
          btnOnlineRestart.classList.remove('hidden');
        }
      }
    }

    // 建立輕量化網路同步快照（移除純 Host 欄位）
    function buildCompactWorld(w) {
      return {
        matchId: w.matchId,
        tick: w.tick,
        phase: w.phase,
        elapsedSec: round1(w.elapsedSec),
        zone: { x: w.zone.x, y: w.zone.y, radius: w.zone.radius },
        items: w.items,
        bullets: w.bullets.map((b) => ({
          isSpecial: b.isSpecial, x: b.x, y: b.y,
          visualRadius: b.visualRadius, color: b.color, style: b.style
        })),
        players: w.players.map((p) => ({
          id: p.id, name: p.name, charName: p.charName, color: p.color,
          attackName: p.attackName, x: p.x, y: p.y, angle: round1(p.angle),
          hp: round1(p.hp), maxHp: p.maxHp, isShielded: p.isShielded,
          kills: p.kills, alive: p.alive
        })),
        ranking: w.ranking
      };
    }

    function gameLoop(now) {
      const dtMs = Math.max(0, Math.min(50, now - lastFrameTime));
      lastFrameTime = now;

      if (appMode === 'practice') {
        stepWorld(dtMs);
      } else if (appMode === 'online' && window.Playroom) {
        const myP = window.Playroom.myPlayer();
        const me = world?.players?.find((p) => p.id === myP?.id);
        if (myP && world?.phase === 'playing' && me?.alive) {
          const inp = readLocalInput();
          const sig = `${inp.dx}|${inp.dy}|${inp.turn}|${inp.firing}`;
          if (sig !== lastInputSent || now - lastInputSentAt > 100) {
            lastInputSent = sig;
            lastInputSentAt = now;
            myP.setState('input', inp);
          }
        }

        // 同步各玩家加油表情
        for (const pp of playroomPlayers) {
          const ev = pp.getState('emojiEvent');
          if (ev && ev.seq && ev.seq !== lastEmojiSyncMap.get(pp.id)) {
            lastEmojiSyncMap.set(pp.id, ev.seq);
            spawnFloatingEmoji(ev.symbol, ev.name || '玩家');
          }
        }

        if (window.Playroom.isHost()) {
          if (world) {
            if (world.phase === 'playing') {
              stepWorld(dtMs);
              if (world.phase === 'gameover') {
                gameoverSynced = true;
                window.Playroom.setState('world', buildCompactWorld(world), true);
              } else if (now - lastWorldSyncAt >= SYNC_INTERVAL_MS) {
                lastWorldSyncAt = now;
                window.Playroom.setState('world', buildCompactWorld(world));
              }
            } else if (!gameoverSynced) {
              gameoverSynced = true;
              window.Playroom.setState('world', buildCompactWorld(world), true);
            }
          }
        } else {
          const synced = window.Playroom.getState('world');
          if (synced) {
            const isNewMatch = synced.matchId !== lastObservedMatchId;
            if (isNewMatch || !world || synced.tick >= world.tick) {
              if (isNewMatch) {
                lastObservedMatchId = synced.matchId;
                localEmojis = [];
                btnOnlineRestart.classList.add('hidden');
              }
              world = synced;
            }
          }
        }
      }

      render(dtMs);
      if (loopRunning) requestAnimationFrame(gameLoop);
    }

    // 啟動練習模式
    function startPractice() {
      appMode = 'practice';
      keys.clear();
      localEmojis = [];
      menuOverlay.classList.add('hidden');
      lobbyOverlay.classList.add('hidden');
      btnReroll.classList.remove('hidden');
      btnOnlineRestart.classList.add('hidden');
      btnBackMenu.classList.remove('hidden');

      world = createInitialWorld([
        { id: 'local', name: '我（教師／學生）', isBot: false },
        { id: 'bot-1', name: '標靶 A', isBot: true },
        { id: 'bot-2', name: '標靶 B', isBot: true }
      ]);

      if (!loopRunning) {
        loopRunning = true;
        lastFrameTime = performance.now();
        requestAnimationFrame(gameLoop);
      }
    }

    // 啟動 6 人連線模式
    async function startOnline() {
      if (onlineStarting) return;
      if (!window.Playroom) {
        alert('Playroom SDK 尚未載入完成，請確認網路連線。');
        return;
      }
      onlineStarting = true;
      btnOnline.disabled = true;
      btnPractice.disabled = true;
      appMode = 'online';

      try {
        const coinOpts = { skipLobby: false, maxPlayersPerRoom: 6 };
        const urlGameId = new URLSearchParams(window.location.search).get('gameId') || PLAYROOM_GAME_ID;
        if (urlGameId) coinOpts.gameId = urlGameId;
        await window.Playroom.insertCoin(coinOpts);
      } catch (err) {
        onlineStarting = false;
        appMode = null;
        btnOnline.disabled = false;
        btnPractice.disabled = false;
        // 移除 Playroom 注入的配額／滿房遮罩，避免鎖死主選單與練習模式
        document.getElementById('full-room-popup')?.remove();
        lobbyOverlay.classList.add('hidden');
        menuOverlay.classList.remove('hidden');
        btnBackMenu.classList.add('hidden');
        const msg = String(err?.message || err || '');
        if (msg.includes('QUOTA_EXCEEDED')) {
          alert('Playroom 預設共用連線配額已達今日上限（QUOTA_EXCEEDED）。\n請教師於 dev.joinplayroom.com 取得免費專屬 gameId 填入 index.html，或先使用「練習模式」！');
        } else {
          alert(`無法加入房間（可能已滿 6 人或連線取消）：${msg}`);
        }
        return;
      }

      menuOverlay.classList.add('hidden');
      lobbyOverlay.classList.remove('hidden');
      btnBackMenu.classList.remove('hidden');

      // 紀錄進入大廳時若已有舊局 matchId，則忽略該舊局結算狀態
      const existingWorld = window.Playroom.getState('world');
      const staleMatchId = existingWorld?.phase === 'gameover' ? existingWorld.matchId : null;

      if (!joinListenerBound) {
        joinListenerBound = true;
        window.Playroom.onPlayerJoin((player) => {
          const idx = playroomPlayers.findIndex((p) => p.id === player.id);
          if (idx >= 0) playroomPlayers[idx] = player;
          else playroomPlayers.push(player);

          // 同步已有表情序號避免新進時噴發舊表情
          const existingEv = player.getState('emojiEvent');
          if (existingEv?.seq) lastEmojiSyncMap.set(player.id, existingEv.seq);

          updateLobbyUI();
          player.onQuit(() => {
            playroomPlayers = playroomPlayers.filter((p) => p.id !== player.id);
            lastEmojiSyncMap.delete(player.id);
            if (world?.phase === 'playing' && window.Playroom?.isHost()) {
              const target = world.players.find((wp) => wp.id === player.id);
              if (target && target.alive) eliminatePlayer(target, null);
            }
            updateLobbyUI();
          });
        });
      }

      const waitLobby = () => {
        if (appMode !== 'online') return;
        const synced = window.Playroom.getState('world');
        if (synced && synced.phase === 'playing' && synced.matchId !== staleMatchId) {
          keys.clear();
          localEmojis = [];
          lastObservedMatchId = synced.matchId;
          world = synced;
          lobbyOverlay.classList.add('hidden');
          if (!loopRunning) {
            loopRunning = true;
            lastFrameTime = performance.now();
            requestAnimationFrame(gameLoop);
          }
          return;
        }
        updateLobbyUI();
        requestAnimationFrame(waitLobby);
      };
      requestAnimationFrame(waitLobby);
    }

    function updateLobbyUI() {
      const count = playroomPlayers.length;
      const isHost = Boolean(window.Playroom?.isHost());
      const names = playroomPlayers.map((p, i) => p.getProfile()?.name || `神秘挑戰者${i + 1}`);
      const snap = `${count}|${isHost}|${names.join(',')}`;
      if (snap === lastLobbySnapshot) return;
      lastLobbySnapshot = snap;

      lobbyTitle.textContent = `🌐 等待玩家加入中... (${count} / 6)`;
      lobbyPlayersEl.innerHTML = '';
      names.forEach((name, i) => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = `玩家 ${i + 1}: ${name}`;
        lobbyPlayersEl.appendChild(chip);
      });

      const full = count >= 6;
      btnStartOnline.disabled = !(isHost && full);
      if (!full) btnStartOnline.textContent = `還差 ${6 - count} 位玩家才能開始...`;
      else if (!isHost) btnStartOnline.textContent = '已滿 6 人！等待房主點擊開始...';
      else btnStartOnline.textContent = '🚀 6 人已到齊！啟動盲盒大逃殺';
    }

    function launchOnlineMatch() {
      if (!window.Playroom?.isHost() || playroomPlayers.length < 6) return;
      btnStartOnline.disabled = true;
      btnOnlineRestart.classList.add('hidden');
      keys.clear();
      localEmojis = [];
      gameoverSynced = false;
      const participants = playroomPlayers.slice(0, 6).map((p, idx) => ({
        id: p.id,
        name: p.getProfile()?.name || `玩家${idx + 1}`,
        isBot: false
      }));
      world = createInitialWorld(participants);
      lastObservedMatchId = world.matchId;
      window.Playroom.setState('world', buildCompactWorld(world), true);
    }

    btnStartOnline.addEventListener('click', () => {
      if (!world) launchOnlineMatch();
    });
    btnOnlineRestart.addEventListener('click', launchOnlineMatch);
    btnPractice.addEventListener('click', startPractice);
    btnOnline.addEventListener('click', startOnline);
    btnReroll.addEventListener('click', startPractice);
    btnBackMenu.addEventListener('click', () => {
      history.replaceState(null, '', window.location.pathname + window.location.search);
      window.location.reload();
    });
  </script>
</body>
